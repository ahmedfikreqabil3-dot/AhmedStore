groups:
  - name: ahmed-store
    rules:
      - alert: ApiUnavailable
        expr: up{job="ahmed-store-api"} == 0
        for: 2m
        labels: {severity: critical}
      - alert: ApiNotReady
        expr: api_ready == 0
        for: 2m
        labels: {severity: critical}
      - alert: ApiErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels: {severity: warning}
      - alert: ApiLatency
        expr: histogram_quantile(0.95, sum by(le) (rate(http_request_duration_seconds_bucket{route!~"/api/v1/health.*|/api/v1/metrics"}[5m]))) > 0.5
        for: 10m
        labels: {severity: warning}

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ahmed_store
      POSTGRES_USER: ahmed_store_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/owner_db_password
    secrets: [owner_db_password, app_db_password]
    volumes:
      - database:/var/lib/postgresql/data
      - ./init-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ahmed_store_owner -d ahmed_store]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    build: {context: .., dockerfile: deploy/Dockerfile, target: build}
    command: [node, --import, tsx, tools/production/migrate.ts]
    environment:
      MIGRATION_DATABASE_URL_FILE: /run/secrets/owner_database_url
      APP_DATABASE_ROLE: ahmed_store_app
      ALLOW_EMPTY_DATABASE_INIT: ${ALLOW_EMPTY_DATABASE_INIT:-0}
      BACKUP_VERIFIED_MANIFEST: ${BACKUP_VERIFIED_MANIFEST:-}
      BACKUP_RESTORE_PROOF: ${BACKUP_RESTORE_PROOF:-}
    secrets: [owner_database_url]
    volumes: ["${BACKUP_PATH:-./backups}:/backups:ro"]
    networks: [private]
    profiles: [maintenance]
    depends_on: {postgres: {condition: service_healthy}}
  api:
    build: {context: .., dockerfile: deploy/Dockerfile, target: api}
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL_FILE: /run/secrets/app_database_url
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
      APP_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN}
      TRUST_PROXY: 172.30.0.0/24
      LOG_LEVEL: info
      RATE_LIMIT_MAX: 600
      AUTH_RATE_LIMIT_MAX: 10
    secrets: [app_database_url, metrics_token]
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s
    restart: unless-stopped
    depends_on: {postgres: {condition: service_healthy}}
  web:
    build: {context: .., dockerfile: deploy/Dockerfile, target: web}
    environment: {APP_DOMAIN: "${APP_DOMAIN:?Set APP_DOMAIN}", TLS_EMAIL: "${TLS_EMAIL:?Set TLS_EMAIL}"}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddy_data:/data, caddy_config:/config]
    networks: [private, public]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on: {api: {condition: service_healthy}}
  backup:
    build: {context: .., dockerfile: deploy/Dockerfile, target: operations}
    environment:
      BACKUP_DATABASE_URL_FILE: /run/secrets/owner_database_url
      BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup_key
      BACKUP_INTERVAL_SECONDS: 86400
    secrets: [owner_database_url, backup_key]
    volumes: ["${BACKUP_PATH:-./backups}:/backups"]
    networks: [private]
    healthcheck:
      test: [CMD, node, -e, "const fs=require('fs');process.exit(Date.now()-fs.statSync('/backups/last-success').mtimeMs<172800000?0:1)"]
      interval: 1h
      timeout: 5s
      start_period: 5m
    restart: on-failure
    depends_on: {postgres: {condition: service_healthy}}
  prometheus:
    image: prom/prometheus:v3.13.5
    profiles: [monitoring]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./alerts.yml:/etc/prometheus/alerts.yml:ro", "prometheus_data:/prometheus"]
    secrets: [metrics_token]
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
secrets:
  owner_db_password: {file: ./.secrets/owner-db-password}
  app_db_password: {file: ./.secrets/app-db-password}
  owner_database_url: {file: ./.secrets/owner-database-url}
  app_database_url: {file: ./.secrets/app-database-url}
  metrics_token: {file: ./.secrets/metrics-token}
  backup_key: {file: ./.secrets/backup-key}
volumes: {database: {}, caddy_data: {}, caddy_config: {}, prometheus_data: {}}
networks:
  private:
    internal: true
    ipam: {config: [{subnet: 172.30.0.0/24}]}
  public: {}

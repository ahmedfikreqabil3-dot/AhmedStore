services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ahmed_store
      POSTGRES_USER: ahmed_store
      POSTGRES_PASSWORD: ahmed_store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahmed_store -d ahmed_store"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
